<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=http://localhost:3001/">
  <title>Wayfarer AI - Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #101827;
      color: #F8F7F3;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #1E293B;
      padding: 36px;
      border-radius: 16px;
      max-width: 520px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(23, 107, 82, 0.2);
      color: #34D399;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 26px;
      font-weight: 700;
      color: #F8F7F3;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #176B52;
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(23, 107, 82, 0.4);
    }
    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #64748B;
    }
  </style>
  <script>
    window.location.replace("http://localhost:3001/");
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">Next.js Live Server Active</div>
    <h1>🧭 Welcome to Wayfarer AI</h1>
    <p>
      You opened VS Code Live Server (port 5500). Next.js applications run on a dedicated server at <strong>localhost:3001</strong>.
    </p>
    <a class="btn" href="http://localhost:3001/">Open Wayfarer AI (localhost:3001)</a>
    <div class="note">Redirecting you automatically...</div>
  </div>
</body>
</html>
